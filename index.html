<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="TibDaftari — qabul, laboratoriya, vrach tasdig‘i va bemor kabinetini bitta tartibli oqimga bog‘laydigan klinika platformasi." />
    <meta name="theme-color" content="#f5f7f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1412" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>TibDaftari</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('clinic.theme') || '"system"');
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
